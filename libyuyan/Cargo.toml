[package]
name = "libyuyan"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "libyuyan"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.81"
futures = "0.3.30"
pretty = "0.12.3"
rand = "0.8.5"
reqwest = { version = "0.11", features = ["json", "blocking"] }
sha1 = "0.10.6"
tokio = { version = "1", features = ["full"] }
bit-vec = "0.6.3"
