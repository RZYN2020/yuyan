[package]
name = "yuyan"
version = "0.1.0"
edition = "2021"
description = "A simple to use bittorrent client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "yuyan_torrent"
path = "src/lib.rs"

[[bin]]
name = "yuyan"
path = "src/yuyan.rs"


[dependencies]
anyhow = "1.0.81"
chrono = "0.4.35"
clap = { version = "4.5.4", features = ["derive"] }
futures = "0.3.30"
pretty = "0.12.3"
rand = "0.8.5"
reqwest = { version = "0.11", features = ["json", "blocking"] }
sha1 = "0.10.6"
tokio = { version = "1", features = ["full"] }
